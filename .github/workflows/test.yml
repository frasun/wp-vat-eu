name: Plugin Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install Composer deps
        run: composer install --prefer-dist --no-progress

      - name: Install npm deps (wp-env)
        run: npm install -g @wordpress/env

      - name: Start wp-env
        run: wp-env start

      - name: Run tests
        run: npm run test
